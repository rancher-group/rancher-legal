# Local-only inspection ingress. API and workers stay on the internal network.
server {
    listen 8001;
    resolver 127.0.0.11 ipv6=off valid=10s;
    location / {
        set $backend_upstream backend:3001;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
# Browser presigned uploads need reachable ingress without giving storage egress.
server {
    listen 8002;
    resolver 127.0.0.11 ipv6=off valid=10s;
    client_max_body_size 100m;
    location / {
        set $storage_upstream storage:9000;
        proxy_pass http://$storage_upstream;
        # SigV4 includes the port in Host; preserve it exactly.
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
    }
}
